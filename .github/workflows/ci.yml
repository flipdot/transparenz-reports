name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        run: pip install poetry
      - name: Check pyproject and lockfile freshness
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run nose2
